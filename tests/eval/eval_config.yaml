metrics_to_run:
  - final_response_quality
  - hallucination

custom_metrics:
  - name: biography_structure_quality
    prompt_template: |
      Evalúa la biografía generada por el agente considerando los siguientes criterios:
      1. ¿Responde directamente a la persona solicitada?
      2. ¿Presenta una estructura clara con secciones como Resumen Ejecutivo, Trayectoria/Hitos y Fuentes?
      3. ¿Incluye enlaces o referencias de búsqueda?

      Consulta del usuario: {prompt}
      Respuesta del agente: {response}

      Devuelve un objeto JSON con el formato:
      {"score": <número entre 1 y 5>, "explanation": "<razón de la puntuación>"}
